version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: meetspot-sql
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${SQL_SA_PASSWORD}
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    networks:
      - meetspot-network

  redis:
    image: redis:latest
    container_name: meetspot-redis
    ports:
      - "6379:6379"
    networks:
      - meetspot-network

  api:
    build:
      context: .
      dockerfile: MeetSpot.API/Dockerfile
    container_name: meetspot-api
    ports:
      - "5249:8080"
    env_file:
      - .env
    depends_on:
      - sqlserver
      - redis
    networks:
      - meetspot-network
    volumes:
      - uploads:/app/wwwroot/images

  web:
    build:
      context: .
      dockerfile: MeetSpot.Web/Dockerfile
    container_name: meetspot-web
    ports:
      - "5156:8080"
    env_file:
      - .env
    depends_on:
      - api
    networks:
      - meetspot-network

volumes:
  sqldata:
  uploads:

networks:
  meetspot-network:
    driver: bridge